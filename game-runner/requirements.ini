# What game-runner asks for. requirements.txt is the lock generated from it;
# the Dockerfile installs the lock, never this file.
# Regenerate only when upgrading on purpose (on the server, from the repo root):
#   docker run --rm -v "$PWD/game-runner:/g:ro" -w /g python:3.11-slim sh -c "echo
'# Generated from requirements.in - do not edit by hand.' && pip install -q -r
requirements.in && pip freeze" > game-runner/requirements.txt
