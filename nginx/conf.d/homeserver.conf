# Basic reverse proxy for the API
server {
    listen 80;
    server_name _; # Will be replaced with domain name later

    # This will allow large uploads
    client_max_body_size 100G;

    # Simple landing check
    location / {
        add_header Content-Type text/plain;
        return 200 "homeserver proxy is running\n";
    }

    # Proxy all /api/* to the FastAPI container
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_http_version 1.1;

        # Preserve useful headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Good defaults for long requests/streaming
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_request_buffering off;    # Helps large/chunked uploads
        proxy_buffering off;            # Reduce latency for streaming
    }
}