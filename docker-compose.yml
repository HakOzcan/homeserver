services:
  backend:
    build: ./backend
    container_name: homeserver-backend
    volumes:
      - /mnt/cloud:/mnt/cloud
      - /mnt/streaming:/mnt/streaming
      - /mnt/cache:/mnt/cache
    expose:
      - "8000"
    environment:
      - VIRTUAL_HOST=hakserver.cc,www.hakserver.cc
      - LETSENCRYPT_HOST=hakserver.cc,www.hakserver.cc
      - LETSENCRYPT_EMAIL=hakan.ozcan6217@gmail.com
    depends_on:
      - db
    restart: unless-stopped

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: hakan
      POSTGRES_PASSWORD: strongpassword
      POSTGRES_DB: homeserver
    volumes:
      - db_data:/var/lib/postgresql/data
    restart: unless-stopped

  nginx-proxy:
    image: jwilder/nginx-proxy:alpine
    container_name: homeserver-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/tmp/docker.sock:ro
      - certs:/etc/nginx/certs:ro
      - vhost:/etc/nginx/vhost.d
      - html:/usr/share/nginx/html
    depends_on:
      - backend
  
  letsencrypt:
    image: nginxproxy/acme-companion
    container_name: homeserver-acme
    environment:
      - NGINX_PROXY_CONTAINER=homeserver-proxy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - certs:/etc/nginx/certs
      - vhost:/etc/nginx/vhost.d
      - html:/usr/share/nginx/html
    depends_on:
      - nginx-proxy
    restart:
      unless-stopped

volumes:
  db_data:
  certs:
  vhost:
  html: