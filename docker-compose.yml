services:
  backend:
    build: ./backend
    container_name: homeserver-backend
    env_file:
      - .env
    volumes:
      - /mnt/cloud:/mnt/cloud
      - /mnt/streaming:/mnt/streaming
      - /mnt/cache:/mnt/cache
    expose:
      - "8000"
    environment:
      - VIRTUAL_HOST=${BACKEND_VIRTUAL_HOST}
      - LETSENCRYPT_HOST=${BACKEND_LETSENCRYPT_HOST}
      - LETSENCRYPT_EMAIL=${LETSENCRYPT_EMAIL}
      - VIRTUAL_PORT=8000
      # game-runner uses host networking (WebRTC), so it's reached via the
      # host gateway instead of the compose service name
      - GAME_RUNNER_URL=http://host.docker.internal:9000
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - db
    restart: unless-stopped
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    logging:
      driver: "json-file"
      options: { max-size: "10m", max-file: "3" }
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3
  
  game-runner:
    build: ./game-runner
    container_name: homeserver-game-runner
    # Needs TURN_SECRET + SERVER_LAN_IP to allocate relays on coturn
    env_file:
      - .env
    # Host networking so aiortc's dynamic UDP ports are directly reachable -
    # WebRTC ICE candidates would otherwise advertise unreachable bridge IPs.
    # Side effects: port 9000 binds on the host (reachable from the LAN),
    # and the backend reaches this service via host.docker.internal.
    network_mode: host
    depends_on:
      - backend
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 8G
          cpus: '4.0'
    logging:
      driver: "json-file"
      options: {max-size: "10m", max-file: "3"}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3

  coturn:
    image: coturn/coturn:4.6-alpine
    container_name: homeserver-coturn
    # Host networking for the same reason as game-runner: relayed media uses
    # a range of UDP ports whose advertised addresses must be real.
    network_mode: host
    restart: unless-stopped
    # detect-external-ip ships with the image; coturn is behind NAT so it must
    # advertise the router's public IP in relay candidates, not its own.
    # ($$ escapes $ from compose so the container's entrypoint evaluates it.)
    command:
      - --listening-port=3478
      - --fingerprint
      - --use-auth-secret
      - --static-auth-secret=${TURN_SECRET}
      - --realm=hakserver.cc
      - --external-ip=$$(detect-external-ip)
      # Fixed relay range so the router can port-forward it (aiortc's own
      # ports are random, which is why we relay instead of forwarding those).
      # Must stay identity-mapped with the router rule: external 49160-49200
      # -> internal 49160-49200 -> here, and with the ufw allow rule.
      - --min-port=49160
      - --max-port=49200
      # An open relay is a tunnel into the LAN: forbid relaying to private
      # ranges, except the server itself - that's where game-runner lives.
      - --allowed-peer-ip=${SERVER_LAN_IP}
      - --denied-peer-ip=10.0.0.0-10.255.255.255
      - --denied-peer-ip=172.16.0.0-172.31.255.255
      - --denied-peer-ip=192.168.0.0-192.168.255.255
      - --denied-peer-ip=127.0.0.0-127.255.255.255
      - --denied-peer-ip=169.254.0.0-169.254.255.255
      # Modest abuse limits: max concurrent relay allocations per user / total
      - --user-quota=8
      - --total-quota=40
      - --no-cli
      - --no-multicast-peers
    logging:
      driver: "json-file"
      options: { max-size: "10m", max-file: "3" }

  frontend:
    build: ./frontend
    container_name: homeserver-frontend
    expose:
      - "80"
    environment:
      - VIRTUAL_HOST=${VIRTUAL_HOST}
      - LETSENCRYPT_HOST=${LETSENCRYPT_HOST}
      - VIRTUAL_PORT=80
  
  db:
    image: postgres:16
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - db_data:/var/lib/postgresql/data
    restart: unless-stopped
    logging:
      driver: "json-file"
      options: { max-size: "10m", max-file: "3" }
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hakan -d homeserver"]
      interval: 30s
      timeout: 10s
      retries: 5

  nginx-proxy:
    image: jwilder/nginx-proxy:alpine
    container_name: homeserver-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/tmp/docker.sock:ro
      - certs:/etc/nginx/certs
      - vhost:/etc/nginx/vhost.d
      - html:/usr/share/nginx/html
    logging:
      driver: "json-file"
      options: { max-size: "10m", max-file: "3" }
    healthcheck:
      disable: true
  
  letsencrypt:
    image: nginxproxy/acme-companion
    container_name: homeserver-acme
    environment:
      - NGINX_PROXY_CONTAINER=homeserver-proxy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - certs:/etc/nginx/certs
      - vhost:/etc/nginx/vhost.d
      - html:/usr/share/nginx/html
    depends_on:
      - nginx-proxy
    restart:
      unless-stopped
    logging:
      driver: "json-file"
      options: { max-size: "10m", max-file: "3" }
  
  cloudflare-ddns:
    image: oznu/cloudflare-ddns
    container_name: homeserver-ddns
    restart: unless-stopped
    environment:
      - API_KEY=${CF_API_TOKEN}
      - ZONE=${CF_ZONE}
      - SUBDOMAIN=
      - PROXIED=false
      - RRTYPE=A
      - DELETE_ON_STOP=false
      - DNS_SERVER=1.1.1.1
      - CRON=*/5 * * * *
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  db_data:
  certs:
  vhost:
  html: